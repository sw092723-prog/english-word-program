<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>검색 기록</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        li {
            margin: 10px 0;
        }

        .buttons {
            margin-top: 25px;
            text-align: center;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 검색 기록</h1>

    {% if history %}

        <ol>
            {% for word in history %}
                <li>{{ word }}</li>
            {% endfor %}
        </ol>

    {% else %}

        <p>검색 기록이 없습니다.</p>

    {% endif %}

    <div class="buttons">

        <a href="/">
            <button>단어 검색으로 돌아가기</button>
        </a>

        {% if history %}
            <a href="/delete-history">
                <button>검색 기록 삭제</button>
            </a>
        {% endif %}

    </div>

</div>

</body>
</html>
